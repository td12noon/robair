<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <!-- Rob Air Logo - Dog Silhouette -->
  <defs>
    <style>
      .logo-green { fill: #1a5f3c; }
      .logo-text { font-family: 'Arial Black', 'Helvetica Neue', sans-serif; font-weight: 900; }
    </style>
  </defs>
  
  <!-- Dog Head Silhouette -->
  <g class="logo-green">
    <!-- Ear -->
    <path d="M145 45 
             Q 120 35, 110 60
             Q 100 90, 115 130
             Q 125 155, 140 170
             Q 155 155, 155 130
             Q 155 90, 145 45
             Z"/>
    
    <!-- Head and face -->
    <path d="M155 130
             Q 160 100, 180 80
             Q 210 55, 260 70
             Q 300 85, 320 120
             Q 330 145, 320 160
             L 310 155
             Q 315 140, 305 125
             Q 290 100, 260 95
             Q 230 90, 210 110
             Q 195 125, 200 150
             Q 205 170, 225 185
             Q 210 195, 200 210
             Q 190 230, 195 255
             Q 200 275, 220 280
             L 220 290
             Q 185 285, 175 255
             Q 165 225, 180 195
             L 165 180
             Q 145 195, 140 220
             Q 135 250, 150 275
             Q 165 295, 195 295
             L 195 305
             Q 155 305, 135 280
             Q 115 255, 125 220
             Q 132 195, 155 175
             Q 140 165, 130 145
             Q 120 120, 130 100
             Q 142 135, 155 130
             Z"/>
    
    <!-- Nose -->
    <ellipse cx="318" cy="158" rx="8" ry="6" fill="#2d2d2d"/>
    
    <!-- Neck/chest accent (gray) -->
    <path d="M175 200
             Q 165 220, 168 250
             Q 172 275, 195 290
             L 190 295
             Q 160 280, 155 250
             Q 150 220, 165 195
             Z" fill="#6b7280"/>
    
    <!-- White accent line on ear -->
    <path d="M138 80
             Q 130 100, 135 130
             Q 140 150, 150 165" 
          stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- ROB AIR Text -->
  <text x="200" y="340" text-anchor="middle" class="logo-text logo-green" font-size="48" letter-spacing="3">ROB AIR</text>
</svg>
